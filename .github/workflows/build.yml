name: Build MMSR Board APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Prepare launcher icon
        shell: bash
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><solid android:color="#1A73E8"/><corners android:radius="20dp"/></shape>' > app/src/main/res/drawable-nodpi/ic_launcher.xml

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain --no-daemon 2>&1 | tee build.log || {
            grep -E "error:|What went wrong|Could not|not found|Execution failed" -A2 build.log | head -10 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MMSR-Board-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
